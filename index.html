<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Лабораторна робота №5 — JavaScript-анімація</title>
<style>
:root{--bg:#f4f6fb;--card:#ffffff;--text:#1d2433;--muted:#5b6478;--border:#d9deea;--c:#3b6df0;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1c212c;--text:#e8ebf3;--muted:#98a1b5;--border:#2d3445}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1c212c;--text:#e8ebf3;--muted:#98a1b5;--border:#2d3445}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:24px 16px}
h1{font-size:1.5rem;margin:0 0 4px}
p.sub{margin:0 0 16px;color:var(--muted)}
#stage{position:relative;height:280px;overflow:hidden;background:var(--card);border:1px solid var(--border);border-radius:12px;--c:#3b6df0}
#ball{position:absolute;top:0;left:0;width:44px;height:44px;border-radius:50%;background:var(--c)}
#square{position:absolute;left:50%;top:50%;width:60px;height:60px;border:6px solid var(--c);border-radius:8px}
#pulse{position:absolute;right:20px;top:20px;width:36px;height:36px;border-radius:50%;background:var(--c);opacity:.7}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 8px}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer}
button:hover{border-color:var(--c)}
button.primary{background:var(--c);border-color:var(--c);color:#fff}
#status{color:var(--muted);font-size:.95rem}
</style>
</head>
<body>
<main>
  <h1>JavaScript-анімація</h1>
  <p class="sub">Лабораторна робота №5 · Веб-технології · Керуйте анімацією кнопками нижче</p>

  <div id="stage">
    <div id="ball"></div>
    <div id="square"></div>
    <div id="pulse"></div>
  </div>

  <div class="controls">
    <button id="btnStart" class="primary">▶ Старт</button>
    <button id="btnPause">⏸ Пауза</button>
    <button id="btnReset">↺ Скинути</button>
    <button id="btnFaster">＋ Швидше</button>
    <button id="btnSlower">－ Повільніше</button>
    <button id="btnColor">🎨 Змінити колір</button>
    <button id="btnHide">👁 Сховати / показати кулю</button>
  </div>
  <div id="status"></div>
</main>

<script>
// 1. Посилання на елементи сторінки
const stage = document.getElementById("stage");
const ball = document.getElementById("ball");
const square = document.getElementById("square");
const pulse = document.getElementById("pulse");
const statusEl = document.getElementById("status");

// 2. Змінні стану анімації
const colors = ["#3b6df0", "#e8590c", "#2f9e44", "#c2255c", "#7048e8"];
let colorIndex = 0;
let x, y, vx, vy, angle, t, speed;
let running = false;
let frameId = null;

// 3. Початкові значення
function initState() {
  x = 20; y = 20;      // позиція кулі
  vx = 3; vy = 2.4;    // швидкість кулі по осях
  angle = 0;           // кут повороту квадрата
  t = 0;               // "час" для пульсації
  speed = 1;           // множник швидкості
}

// 4. Малювання: застосовуємо стан до елементів
function draw() {
  ball.style.transform = `translate(${x}px, ${y}px)`;
  square.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;
  pulse.style.transform = `scale(${1 + 0.3 * Math.sin(t)})`;
  statusEl.textContent = `Швидкість: ${speed.toFixed(1)}× · ` + (running ? "анімація працює" : "анімація на паузі");
}

// 5. Один кадр анімації
function frame() {
  const maxX = stage.clientWidth - ball.offsetWidth;
  const maxY = stage.clientHeight - ball.offsetHeight;
  x += vx * speed;
  y += vy * speed;
  if (x <= 0 || x >= maxX) { vx = -vx; x = Math.max(0, Math.min(x, maxX)); }
  if (y <= 0 || y >= maxY) { vy = -vy; y = Math.max(0, Math.min(y, maxY)); }
  angle += 2 * speed;
  t += 0.05 * speed;
  draw();
  frameId = requestAnimationFrame(frame);
}

// 6. Функції керування
function start() {
  if (running) return;
  running = true;
  frameId = requestAnimationFrame(frame);
}
function pause() {
  running = false;
  cancelAnimationFrame(frameId);
  draw();
}
function reset() {
  pause();
  initState();
  draw();
}

// 7. Обробники подій кнопок
document.getElementById("btnStart").addEventListener("click", start);
document.getElementById("btnPause").addEventListener("click", pause);
document.getElementById("btnReset").addEventListener("click", reset);
document.getElementById("btnFaster").addEventListener("click", function () {
  speed = Math.min(speed + 0.5, 5);
  draw();
});
document.getElementById("btnSlower").addEventListener("click", function () {
  speed = Math.max(speed - 0.5, 0.5);
  draw();
});
document.getElementById("btnColor").addEventListener("click", function () {
  colorIndex = (colorIndex + 1) % colors.length;
  stage.style.setProperty("--c", colors[colorIndex]);
});
document.getElementById("btnHide").addEventListener("click", function () {
  ball.style.display = ball.style.display === "none" ? "block" : "none";
});

// 8. Запуск при завантаженні сторінки
initState();
draw();
start();
</script>
</body>
</html>
